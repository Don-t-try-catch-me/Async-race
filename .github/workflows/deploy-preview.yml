# This is a basic workflow to help you get started with Actions

name: Deploy PR Preview

# Controls when the workflow will run
on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened]

# Cancel in-progress runs for the same PR
concurrency:
  group: deploy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Validate and build first
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.1.0
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6.0.0
        with:
          name: build-${{ github.event.pull_request.number }}
          path: dist/  # Adjust based on your build output

  # Deploy to Netlify
  deploy-netlify:
    runs-on: ubuntu-latest
    needs: validate-and-build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7.0.0
        with:
          name: build-${{ github.event.pull_request.number }}
          path: ./dist

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0.0
        with:
          publish-dir: './dist'
          production-deploy: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: 'PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}'
          enable-commit-comment: false
          enable-pull-request-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
